<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>
        {% block title %}
            Creator
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="{{ url_for('public.home') }}"
                class="brand"
            >
                {% if creator %}
                    {{ creator.display_name }}
                {% else %}
                    Creator
                {% endif %}
            </a>


            <nav class="main-nav">

                <a href="{{ url_for('public.home') }}">
                    Home
                </a>

                <a href="#">
                    Stories
                </a>

                <a href="#">
                    Reels
                </a>

                <a href="#">
                    Vlogs
                </a>

                <a
                    href="#"
                    class="exclusive-link"
                >
                    Exclusive
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         PAGE
    ====================================================== -->

    <main>

        {% block content %}
        {% endblock %}

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <p>
            © {{ creator.display_name if creator else "Creator" }}
        </p>

    </footer>


    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>

</body>

</html>
